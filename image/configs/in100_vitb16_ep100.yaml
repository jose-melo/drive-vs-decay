# ImageNet-100, ViT-B/16, 128 px.

data:
  batch_size: 128
  color_jitter_strength: 0.0
  crop_scale:
  - 0.8
  - 1.0
  crop_size: 128
  root_path: ./data/imagenet100
  num_workers: 8
  pin_mem: true
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: true
  dataset: imagenet100

logging:
  folder: ./logs/in100_vitb16_ep100/
  write_tag: jepa

mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 4
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 16
  pred_mask_scale:
  - 0.15
  - 0.2

meta:
  copy_data: false
  load_checkpoint: false
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  read_checkpoint: null
  use_bfloat16: true
  predictor_type: standard
  beta_init: 10.0

optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 100
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.0002
  warmup: 10
  weight_decay: 0.04

evaluation:
  probe_every: 25
  erank_every: 5
  linear_probe_epochs: 30
  linear_probe_lr: 0.1
  num_classes: 100
