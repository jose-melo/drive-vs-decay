# ImageNet-1k, ViT-S/16, 224 px, 30 epochs.

data:
  batch_size: 256          # per GPU
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224           # 196 tokens
  root_path: ./data/imagenet
  num_workers: 10
  pin_mem: true
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: true
  dataset: imagenet1k

logging:
  folder: ./logs/in1k_vits16_224px_30ep/
  write_tag: jepa

mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 4
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 16
  pred_mask_scale:
  - 0.15
  - 0.2

meta:
  copy_data: false
  load_checkpoint: false
  model_name: vit_small
  pred_depth: 6
  pred_emb_dim: 384
  read_checkpoint: null
  use_bfloat16: true
  predictor_type: standard
  beta_init: 10.0
  checkpoint_freq: 5

optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 30
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.0002
  warmup: 10
  weight_decay: 0.04

evaluation:
  probe_every: 9999        # probe at the last epoch only
  erank_every: 5
  linear_probe_epochs: 20
  linear_probe_lr: 0.1
  num_classes: 1000
